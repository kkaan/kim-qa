[project]
name = "kim-qa"
version = "0.1.0"
description = "KIM (Kilo-voltage Imaging for Motion management) QA analysis core library"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
tools = ["matplotlib"]
server = ["fastapi", "uvicorn", "pillow"]
dev = ["pylint", "pyinstaller", "pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kim_qa"]
